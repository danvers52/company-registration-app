services:
  app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/company-registration
    command: npm start

  test:
    build: .
    depends_on:
      - mongo
    environment:
      - MONGO_URI_TEST=mongodb://mongo:27017/company-registration-test
    command: sh -c "until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done; npm test"

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
