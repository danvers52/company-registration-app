services:
  app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/company-registration?replicaSet=rs0
    command: npm start

  test:
    build: .
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/company-registration-test?replicaSet=rs0
      - NODE_ENV=test
    command: sh -c "until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done; npm test"

  mongo:
    image: mongo:6
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
